name: Build asset bank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_assets.py'
      - 'scripts/generate_media_pack.py'
      - '.github/workflows/build-assets.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[generated-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow numpy

      - name: Generate base assets
        run: python scripts/generate_assets.py

      - name: Generate media pack
        run: python scripts/generate_media_pack.py

      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images graphics audio video gifs
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m '[generated-assets] build expanded media bank'
          git push
